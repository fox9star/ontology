{{- if and (eq .Values.graphStore.backend "fuseki") .Values.graphStore.fuseki.embedded }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ontology-fuseki
  labels:
    {{- include "ontology-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki
spec:
  serviceName: ontology-fuseki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-fuseki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-fuseki
    spec:
      containers:
        - name: fuseki
          image: stain/jena-fuseki:latest
          ports:
            - containerPort: 3030
              name: fuseki-port
          env:
            - name: ADMIN_PASSWORD
              value: "admin"
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-fuseki
  labels:
    {{- include "ontology-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3030
      targetPort: 3030
      name: fuseki
  selector:
    app.kubernetes.io/name: ontology-fuseki
{{- end }}
