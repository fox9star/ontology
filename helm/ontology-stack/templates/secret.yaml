apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontology-stack.fullname" . }}-secrets
  labels:
    {{- include "ontology-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEO4J_URI: {{ .Values.graphStore.neo4j.uri | quote }}
  NEO4J_USER: {{ .Values.graphStore.neo4j.user | quote }}
  NEO4J_PASSWORD: {{ .Values.graphStore.neo4j.password | quote }}
